name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/wibecur

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run
        env:
          # Modules that import prisma at load time need a non-empty URL
          DATABASE_URL: postgresql://user:pass@localhost:5432/wibecur

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/wibecur
          NEXTAUTH_SECRET: ci-secret-min-32-chars-for-build
          NEXTAUTH_URL: https://example.com
          ENCRYPTION_KEY: ci-encryption-key-32chars!!

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wibecur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wibecur

      - name: Setup database
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wibecur

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wibecur
          NEXTAUTH_SECRET: ci-secret-min-32-chars-for-e2e
          NEXTAUTH_URL: http://localhost:3002
          ENCRYPTION_KEY: ci-encryption-key-32chars!!

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wibecur
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wibecur
      NEXTAUTH_SECRET: ci-secret-min-32-chars-for-lighthouse
      NEXTAUTH_URL: http://localhost:3002
      ENCRYPTION_KEY: ci-encryption-key-32chars!!
      PORT: '3002'
      LHCI_BASE_URL: http://localhost:3002
      LHCI_HOME_PATH: /
      LHCI_CATEGORY_PATH: /categories/movies
      LHCI_LIST_PATH: /lists/great-breakfast-cafes
      LHCI_BASELINE_LABEL: ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup database
        run: |
          npx prisma db push
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start > /tmp/wibe-server.log 2>&1 &
          echo $! > /tmp/wibe-server.pid

      - name: Wait for server
        run: npx wait-on -t 120000 http-get://127.0.0.1:3002/ http-get://127.0.0.1:3002/categories/movies http-get://127.0.0.1:3002/lists/great-breakfast-cafes

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci

      - name: Write baseline snapshot
        if: always()
        run: npm run lighthouse:baseline

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/wibe-server.pid ]; then
            kill "$(cat /tmp/wibe-server.pid)" || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            perf/baselines/
          retention-days: 14

      - name: Summarize scores
        if: always()
        run: node scripts/lighthouse-summary.mjs
